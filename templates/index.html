<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EduGenie - AI Learning Assistant</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>

    <header class="hero">
        <div class="container">

            <div class="brand">
                <span class="brand-icon">🎓</span>
                <span>EduGenie</span>
            </div>

            <h1>Learn Smarter with AI</h1>

            <p>
                Ask questions, understand concepts, summarize content,
                generate quizzes, and build personalized learning paths.
            </p>

        </div>
    </header>


    <main class="container">

        <section class="card">

            <h2>What do you want to learn?</h2>

            <!-- IMPORTANT:
                 There is NO action attribute.
                 JavaScript handles this form.
            -->

            <form id="eduForm" onsubmit="return false;">

                <div class="form-group">

                    <label for="task">
                        Select Task
                    </label>

                    <select id="task" name="task">

                        <option value="explain">
                            Explain a Concept
                        </option>

                        <option value="qa">
                            Ask a Question
                        </option>

                        <option value="quiz">
                            Generate Quiz
                        </option>

                        <option value="summarize">
                            Summarize
                        </option>

                        <option value="recommend">
                            Learning Path
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="userInput">
                        Your Input
                    </label>

                    <textarea
                        id="userInput"
                        name="userInput"
                        rows="6"
                        placeholder="Enter your question or topic..."
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="level">
                        Your Current Level
                    </label>

                    <select id="level" name="level">

                        <option value="beginner">
                            Beginner
                        </option>

                        <option value="intermediate">
                            Intermediate
                        </option>

                        <option value="advanced">
                            Advanced
                        </option>

                    </select>

                </div>


                <button
    id="generateBtn"
    type="button"
    class="primary-button"
>
    Generate
</button>

            </form>

        </section>


        <section class="card result-card">

            <div class="result-header">

                <h2>EduGenie Result</h2>

                <button
                    id="clearBtn"
                    type="button"
                    class="secondary-button"
                >
                    Clear
                </button>

            </div>


            <div id="result">

                <p class="placeholder">
                    Your AI-generated result will appear here.
                </p>

            </div>

        </section>

    </main>


    <footer>
        EduGenie • AI Powered Learning Assistant
    </footer>


    <!-- IMPORTANT:
         This MUST be the final script before </body>.
    -->

    <script src="/static/js/app.js"></script>

</body>
</html>
